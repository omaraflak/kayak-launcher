[package]
name = "kayak-launcher"
version = "1.0.5"
description = "Runs and updates Kayak"
authors = ["Omar Aflak"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri builds the app through the library target; the binary is a thin shim.
name = "kayak_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
# Blocking HTTP is a deliberate fit here: every call the launcher makes already
# runs on its own thread alongside blocking Docker CLI calls, so an async
# runtime would add a dependency without removing any waiting.
ureq = { version = "2.10", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
