<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kayak</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app">
      <header class="brand">
        <div class="mark" aria-hidden="true">
          <svg viewBox="0 0 100 100" width="40" height="40">
            <rect width="100" height="100" rx="24" fill="var(--primary)" />
            <!--
              Hull and paddle share a rotation so they stay perpendicular, and
              the paddle is drawn first so the hull stays one unbroken shape.
              The hull's stroke is the plate colour, which reads as a gap.
            -->
            <g transform="rotate(-35 50 50)">
              <rect x="17" y="45.5" width="66" height="9" rx="4.5" fill="#fff" />
              <!--
                The stroke is centred on the outline, so half of it eats into
                the hull. These radii are larger than the visible hull by that
                half-width, which is what keeps this matching the app icon.
              -->
              <ellipse
                cx="50"
                cy="50"
                rx="11.5"
                ry="39.5"
                fill="#fff"
                stroke="var(--primary)"
                stroke-width="5.2"
              />
            </g>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Kayak</h1>
          <p id="version">&nbsp;</p>
        </div>
      </header>

      <section id="body" class="body"></section>

      <footer id="footer" class="footer"></footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
