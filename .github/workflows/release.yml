name: Release

# Tag-driven, matching the Kayak image release flow. The updater endpoint reads
# latest.json from the newest published release, so a release stays a draft
# until it is reviewed -- publishing it is what actually offers the update to
# everyone who already has the launcher installed.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon and Intel are built separately rather than as a
          # universal binary, so each download stays half the size.
          - platform: macos-latest
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            label: macOS (Intel)
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          # Built on the oldest supported Ubuntu on purpose: the bundle links
          # against the build machine's glibc, so a newer runner would produce
          # a binary that refuses to start on older distributions.
          - platform: ubuntu-22.04
            label: Linux
            target: ""
            args: ""
          - platform: windows-latest
            label: Windows
            target: ""
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Without these the bundle is still produced but carries no signature,
          # and installed launchers reject an unsigned update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Kayak ${{ github.ref_name }}
          # Published straight away rather than left as a draft. A draft is
          # invisible to everyone but the repository owner, and `releases/latest`
          # skips it, so an unpublished draft silently means both "no download
          # link" and "no update for anyone already installed".
          releaseDraft: false
          prerelease: false
          # Produces the latest.json manifest the updater plugin polls.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Old releases serve no one: the updater reads latest.json from the newest
  # release only, so binaries older than the last three exist purely as
  # rollback insurance. Pruning here keeps exactly three. Git tags are kept --
  # they cost nothing and preserve the history a deleted release came from.
  prune:
    name: Prune old releases
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Delete releases older than the newest three
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          all=$(gh api "repos/$GH_REPO/releases" --paginate \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name')
          keep=$(printf '%s\n' $all | sort -V | tail -n 3)
          echo "keeping:" $keep
          for tag in $all; do
            if ! grep -qxF "$tag" <<< "$keep"; then
              gh release delete "$tag" --repo "$GH_REPO" --yes
              echo "deleted release $tag"
            fi
          done
